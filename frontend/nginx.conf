map $uri $workspace_cache_policy {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/health$ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $workspace_cache_policy always;
    # Resolve Compose DNS again after backend recreation; no host credentials.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $api_origin http://backend:8000;
    location = /ready { access_log off; default_type text/plain; return 200 'ready'; }
    location ~ ^/(api/|health$|openapi.json$) {
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 110s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        # No access logging of authenticated operator attempts.
        access_log off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
